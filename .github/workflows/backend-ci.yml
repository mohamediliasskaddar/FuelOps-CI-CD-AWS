name: Backend CI

on:
  push:
    branches:
      - master
    paths:
      - 'gestion-station/**'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: gestion-station

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
#          docker build -t ghcr.io/${{ github.repository_owner }}/backend-app:${{ github.sha }}  .
          docker build -t ghcr.io/${{ github.repository_owner }}/backend-app:latest  .

      - name: Push Docker image
        run: |
#          docker push ghcr.io/${{ github.repository_owner }}/backend-app:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/backend-app:lastest