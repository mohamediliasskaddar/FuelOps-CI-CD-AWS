name: Backend CI

on:
  push:
    branches:
      - master
    paths:
      - 'gestion-station/**'


jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: gestion-station

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: mvn clean package -DskipTests